# verl-native GRPO baseline (main_ppo). Same model/data/hyperparams as the Pie run;
# only the rollout + weight-sync backend differs (verl's native vLLM SPMD, no Pie).
# Launched by run_baseline.sh. NOTE: verl's config tree moves fast — on the first pod,
# reconcile any renamed keys against verl/trainer/config/ (the runner prints the
# resolved config so mismatches surface immediately).
algorithm:
  adv_estimator: grpo
data:
  train_files: recipe/pie_grpo/experiments/data/humaneval_train.parquet
  val_files: recipe/pie_grpo/experiments/data/humaneval_test.parquet
  train_batch_size: 8          # problems_per_step
  max_prompt_length: 512
  max_response_length: 512
  prompt_key: prompt
actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-Coder-1.5B-Instruct
  actor:
    optim:
      lr: 3.0e-6
    ppo_mini_batch_size: 16
    use_dynamic_bsz: false
  rollout:
    name: vllm
    n: 8                        # n_samples
    temperature: 0.8
    top_p: 0.95
    gpu_memory_utilization: 0.5
    tensor_model_parallel_size: 1
reward:
  custom_reward_function:
    path: recipe/pie_grpo/experiments/baseline/humaneval_reward_verl.py
    name: compute_score
trainer:
  n_gpus_per_node: 2
  nnodes: 1
  total_epochs: 1
  total_training_steps: 50
  test_freq: 5
  logger: [console]
